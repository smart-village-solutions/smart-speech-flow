name: Copilot Review Gate

on:
  pull_request_review:
    types: [submitted]

permissions:
  contents: read
  statuses: write

jobs:
  mark-copilot-review-complete:
    if: >-
      github.event.pull_request.draft == false &&
      github.event.review.user.login == 'copilot-pull-request-reviewer[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Mark Copilot review as complete
        uses: actions/github-script@v9
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.payload.pull_request.head.sha,
              state: 'success',
              context: 'Copilot review complete',
              description: 'GitHub Copilot completed its review',
              target_url: context.payload.pull_request.html_url,
            });
