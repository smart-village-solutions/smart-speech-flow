name: CI — Pytest (tests/ and the per-service suites)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -r services/api_gateway/requirements.txt

      # Pinned so a new Prometheus release cannot change CI behaviour
      # silently. Without this, tests/test_alert_rules_promtool.py and the
      # promtool-dependent cases in tests/test_feedback_maintenance_alerting.py
      # and tests/test_quality_telemetry_alerting.py skip instead of running,
      # and a broken alert expression merges green.
      - name: Install promtool
        run: |
          curl -sL -o /tmp/prometheus.tar.gz \
            https://github.com/prometheus/prometheus/releases/download/v3.9.1/prometheus-3.9.1.linux-amd64.tar.gz
          tar xzf /tmp/prometheus.tar.gz -C /tmp prometheus-3.9.1.linux-amd64/promtool
          sudo mv /tmp/prometheus-3.9.1.linux-amd64/promtool /usr/local/bin/promtool
          promtool --version

      - name: Run hermetic pytest subset
        env:
          PYTHONPATH: .
          SSF_AUDIO_BASE_DIR: ${{ runner.temp }}/audio
        run: |
          echo "Running hermetic pytest subset on tests/ and the per-service suites (integration, load and real-system suites are skipped in CI)"
          pytest tests/ \
            services/api_gateway/tests \
            services/asr/tests \
            services/translation/tests \
            services/tts/tests \
            -q \
            -m "not integration and not real_system" \
            --ignore=tests/integration \
            --ignore=tests/load \
            --ignore=tests/integration_test_audio_validation.py

  keycloak-theme:
    name: Keycloak theme image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -r services/api_gateway/requirements.txt

      - name: Verify the Keycloak theme image
        env:
          PYTHONPATH: .
        run: pytest --run-integration -q tests/operations/test_keycloak_realm.py

  feedback-database:
    name: Feedback integration (PostgreSQL)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -r services/api_gateway/requirements.txt

      # The real apply.sh and migrations, with generated passwords; the script
      # writes every role's URL and password to GITHUB_ENV and fails unless
      # every migration ran.
      - name: Start the feedback and recording database
        run: scripts/ci/start-recording-postgres.sh

      - name: Run the feedback integration tests
        # The URLs and passwords arrive from the previous step through GITHUB_ENV.
        env:
          PYTHONPATH: .
        run: |
          pytest --run-integration -q \
            tests/integration/test_feedback_repository.py \
            tests/integration/test_feedback_row_level_security.py \
            tests/integration/test_feedback_read_access.py \
            tests/integration/test_feedback_migration.py \
            tests/integration/test_recording_database.py \
            tests/integration/test_recording_ceremony_database.py \
            tests/integration/test_recording_archive_database.py \
            tests/integration/test_recording_archive_access_database.py \
            tests/integration/test_recording_recovery_requests_database.py \
            tests/integration/test_recording_key_recovery_database.py \
            tests/integration/test_recording_retention_database.py \
            tests/integration/test_recording_retention_store.py \
            tests/integration/test_recording_retention_expiry_database.py

      - name: Database logs on failure
        if: failure()
        run: docker logs ssf-postgres-ci

      - name: Stop the database
        if: always()
        run: docker rm -f ssf-postgres-ci

  archive-storage:
    name: Archive storage integration (SeaweedFS)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -r services/api_gateway/requirements.txt

      # A primary and a replica shaped like deploy/archive-storage, with random
      # credentials per run. The script refuses to go on if either filer or
      # volume server accepts an unsigned write.
      - name: Start the archive store
        run: |
          scripts/recording/archive-test-stack.sh up "$RUNNER_TEMP/archive"
          cat "$RUNNER_TEMP/archive/archive-test.env" >> "$GITHUB_ENV"

      # The retention workers of both sites against this store and a real database (#618).
      - name: Start the recording database
        run: scripts/ci/start-recording-postgres.sh

      - name: Run the archive storage integration tests
        env:
          PYTHONPATH: .
          SSF_ARCHIVE_TEST_REQUIRED: "1"
        run: |
          pytest --run-integration -q \
            tests/integration/test_archive_storage.py \
            tests/integration/test_retention_two_sites.py

      - name: Archive store logs on failure
        if: failure()
        run: |
          docker logs ssf-archive-test-primary
          docker logs ssf-archive-test-replica
          docker logs ssf-archive-test-sync
          docker logs ssf-postgres-ci

      - name: Stop the archive store
        if: always()
        run: |
          scripts/recording/archive-test-stack.sh down
          docker rm -f ssf-postgres-ci
