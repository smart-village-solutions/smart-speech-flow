services:
  traefik:
    image: traefik:v2.11.52
    command:
      - --api.dashboard=true
      - --log.level=DEBUG
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.le.acme.tlschallenge=true
      - --certificatesresolvers.le.acme.email=admin@smart-village.solutions
      - --certificatesresolvers.le.acme.storage=/letsencrypt/acme.json
    environment:
      - DOCKER_API_VERSION=1.41
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./letsencrypt:/letsencrypt
    restart: always

  asr:
    build:
      context: .
      dockerfile: services/asr/Dockerfile
    ports:
      - "8001:8000"
    volumes:
      - ./models:/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  translation:
    build:
      context: .
      dockerfile: services/translation/Dockerfile
    ports:
      - "8002:8000"
    environment:
      # Inference Admission Control — inference runs off the event loop, so
      # /health and /metrics stay responsive; these bound how many beam searches
      # reach the shared M2M100 instance at once. Raise from load-test evidence
      # using translation_queue_wait_seconds and translation_rejected_total.
      - MAX_CONCURRENT_TRANSLATIONS=${MAX_CONCURRENT_TRANSLATIONS:-2}
      - TRANSLATION_QUEUE_WAIT_SECONDS=${TRANSLATION_QUEUE_WAIT_SECONDS:-25.0}
    volumes:
      - ./models:/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
  tts:
    build:
      context: .
      dockerfile: services/tts/Dockerfile
    ports:
      - "8003:8000"
    volumes:
      - ./models:/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  api_gateway:
    build:
      context: .
      dockerfile: services/api_gateway/Dockerfile
    ports:
      - "8000:8000"

    # Resource Limits (verhindert OOM bei vielen Audio-Files)
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '1.0'
          memory: 1G

    volumes:
      # Persistent Audio Storage (named volume keeps write access for the
      # non-root container user without relying on host directory ownership)
      - audio-data:/data/audio

      # Temporary Upload Buffer (RAM - tmpfs)
      - type: tmpfs
        target: /tmp/audio
        tmpfs:
          size: 1G

    environment:
      - REDIS_URL=redis://redis:6379/0
      - REDIS_NAMESPACE=ssf
      - CLIENT_BASE_URL=https://translate.smart-village.solutions
      # Audio Storage Configuration
      - AUDIO_STORAGE_PATH=/data/audio
      - AUDIO_RETENTION_HOURS=24
      - AUDIO_TEMP_PATH=/tmp/audio
      - AUDIO_MAX_DISK_USAGE_GB=9
      - AUDIO_CLEANUP_INTERVAL_MINUTES=60
      - ENABLE_PIPELINE_METADATA=true
      # LLM Refinement Configuration
      - LLM_REFINEMENT_ENABLED=${LLM_REFINEMENT_ENABLED:-true}
      - LLM_REFINEMENT_MODEL=${LLM_REFINEMENT_MODEL:-gpt-oss:20b}
      - LLM_REFINEMENT_MODE=${LLM_REFINEMENT_MODE:-primary_only}
      - LLM_REFINEMENT_PRIMARY_MODEL=${LLM_REFINEMENT_PRIMARY_MODEL:-gpt-oss:20b}
      - LLM_REFINEMENT_CANDIDATE_MODEL=${LLM_REFINEMENT_CANDIDATE_MODEL:-phi4-mini}
      - LLM_REFINEMENT_SHADOW_QUEUE_LIMIT=${LLM_REFINEMENT_SHADOW_QUEUE_LIMIT:-4}
      - LLM_REFINEMENT_ENDPOINT=${LLM_REFINEMENT_ENDPOINT:-http://ollama:11434}
      - LLM_REFINEMENT_TIMEOUT=${LLM_REFINEMENT_TIMEOUT:-4.0}
      - LLM_REFINEMENT_TEMPERATURE=${LLM_REFINEMENT_TEMPERATURE:-0.7}
      - LLM_REFINEMENT_THINK=${LLM_REFINEMENT_THINK:-false}
      - LLM_REFINEMENT_MAX_RETRIES=${LLM_REFINEMENT_MAX_RETRIES:-1}
      # Pipeline Admission Control — bounds concurrent GPU pipeline work.
      # One GPU hosts asr, translation and tts together, so the default is
      # deliberately low; raise it from load-test evidence and watch
      # gateway_pipeline_in_flight / _queue_wait_seconds / _rejected_total.
      # 0 disables the bound.
      - MAX_CONCURRENT_PIPELINES=${MAX_CONCURRENT_PIPELINES:-2}
      - PIPELINE_QUEUE_WAIT_SECONDS=${PIPELINE_QUEUE_WAIT_SECONDS:-10.0}
      # Rate Limiting Configuration für Produktion
      - GLOBAL_RATE_LIMIT=${GLOBAL_RATE_LIMIT:-1200}
      - GLOBAL_RATE_WINDOW_SECONDS=${GLOBAL_RATE_WINDOW_SECONDS:-60}
      - MESSAGE_RATE_LIMIT=${MESSAGE_RATE_LIMIT:-50}
      - MESSAGE_RATE_WINDOW_SECONDS=${MESSAGE_RATE_WINDOW_SECONDS:-10}
      # Production Configuration (allows Figma and translate.smart-village.solutions)
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - DEVELOPMENT_CORS_ORIGINS=${DEVELOPMENT_CORS_ORIGINS:-http://localhost:5173,http://localhost:5174}
      # Quality telemetry (OTLP -> collector -> ClickHouse)
      # `probe` by default so a local `compose up` produces rows to inspect.
      # Production sets this to `disabled` explicitly in
      # deploy/production/docker-compose.production.yml.
      - SSF_QUALITY_TELEMETRY_MODE=${SSF_QUALITY_TELEMETRY_MODE:-probe}
      - SSF_QUALITY_TELEMETRY_SESSION_KEY=${SSF_QUALITY_TELEMETRY_SESSION_KEY:-}
      - SSF_OTLP_LOGS_ENDPOINT=${SSF_OTLP_LOGS_ENDPOINT:-http://otel-collector:4318/v1/logs}
      - SSF_RELEASE_VERSION=${SSF_RELEASE_VERSION:-unknown}
      - SSF_DEPLOYMENT_ENV=${SSF_DEPLOYMENT_ENV:-unknown}

    # Health Checks
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    # Logging Configuration
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"

    depends_on:
      - redis
      - ollama
    labels:
      - "traefik.enable=true"
      # Main HTTP router with WebSocket support
      - "traefik.http.routers.api_gateway.rule=Host(`ssf.smart-village.solutions`)"
      - "traefik.http.routers.api_gateway.entrypoints=websecure"
      - "traefik.http.routers.api_gateway.tls.certresolver=le"
      - "traefik.http.services.api_gateway.loadbalancer.server.port=8000"
      # Configure service to handle WebSocket upgrades
      - "traefik.http.services.api_gateway.loadbalancer.passhostheader=true"
      - "traefik.http.middlewares.websocket-headers.headers.customrequestheaders.X-Forwarded-Proto=https"
    restart: always

  ollama:
    image: ollama/ollama:0.32.0
    expose:
      - "11434"
    environment:
      - OLLAMA_HOST=0.0.0.0
    volumes:
      - ollama-data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: always

  redis:
    image: redis:7.4.7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    expose:
      - "6379"
    volumes:
      - redis-data:/data
    restart: always

  clickhouse:
    image: clickhouse/clickhouse-server:26.3.17.110
    restart: always
    expose:
      - "8123"
    environment:
      - CLICKHOUSE_DB=${CLICKHOUSE_DB:?set CLICKHOUSE_DB in .env}
      - CLICKHOUSE_USER=${CLICKHOUSE_USER:?set CLICKHOUSE_USER in .env}
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD:?required}
      - CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      # Creates both medallion tiers before the collector's first export. Runs
      # only when the data directory is empty; existing volumes need the manual
      # apply in docs/operations/runbooks/clickhouse-operations.md.
      - ./deploy/clickhouse:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8123/ping | grep -qx 'Ok.'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.159.0
    restart: always
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    expose:
      - "4318"
      - "13133"
      - "8888"
    environment:
      - CLICKHOUSE_DB=${CLICKHOUSE_DB:?set CLICKHOUSE_DB in .env}
      - CLICKHOUSE_USER=${CLICKHOUSE_USER:?set CLICKHOUSE_USER in .env}
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD:?required}
    volumes:
      - ./monitoring/otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    depends_on:
      clickhouse:
        condition: service_healthy

  keycloak-postgres:
    image: postgres:17.7-alpine
    restart: always
    environment:
      POSTGRES_DB: ${KEYCLOAK_DB_NAME:?required}
      POSTGRES_USER: ${KEYCLOAK_DB_USER:?required}
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?required}
    volumes:
      - keycloak-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  keycloak:
    image: ssf-keycloak:26.7.2
    build:
      context: ./services/keycloak
      dockerfile: Dockerfile
    command: ["start", "--optimized"]
    restart: always
    expose:
      - "8080"
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: keycloak-postgres
      KC_DB_URL_DATABASE: ${KEYCLOAK_DB_NAME:?required}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER:?required}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?required}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_BOOTSTRAP_ADMIN_USERNAME:?required}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_BOOTSTRAP_ADMIN_PASSWORD:?required}
      KC_HOSTNAME: https://${KEYCLOAK_HOSTNAME:?required}
      KC_PROXY_HEADERS: xforwarded
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
    depends_on:
      keycloak-postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -ec 'exec 3<>/dev/tcp/127.0.0.1/9000; printf \"GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3; grep -q \"200 OK\" <&3'",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.keycloak.rule=Host(`${KEYCLOAK_HOSTNAME:?required}`)"
      - "traefik.http.routers.keycloak.entrypoints=websecure"
      - "traefik.http.routers.keycloak.tls.certresolver=le"
      - "traefik.http.services.keycloak.loadbalancer.server.port=8080"

  frontend-archive:
    build:
      context: ../ssf-frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend-archive.rule=Host(`translate-archive.smart-village.solutions`)"
      - "traefik.http.routers.frontend-archive.entrypoints=websecure"
      - "traefik.http.routers.frontend-archive.tls.certresolver=le"
    restart: always

  frontend:
    build:
      context: ./services/frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: https://ssf.smart-village.solutions
        VITE_WS_BASE_URL: wss://ssf.smart-village.solutions
        VITE_DEMO_ACCESS_CODE: ${FRONTEND_DEMO_PASSWORD:-ssf2025kassel}
    networks:
      - default
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`translate.smart-village.solutions`)"
      - "traefik.http.routers.frontend.entrypoints=websecure"
      - "traefik.http.routers.frontend.tls.certresolver=le"
      - "traefik.http.services.frontend.loadbalancer.server.port=8080"
      - "traefik.docker.network=ssf-backend_default"
    restart: always


  prometheus:
    image: prom/prometheus:v3.13.1
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./monitoring/alert_rules.yml:/etc/prometheus/alert_rules.yml
    expose:
      - "9090"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.prometheus.rule=Host(`prometheus-ssf.smart-village.solutions`)"
      - "traefik.http.routers.prometheus.entrypoints=websecure"
      - "traefik.http.routers.prometheus.tls=true"
      - "traefik.http.routers.prometheus.tls.certresolver=le"
      - "traefik.http.routers.prometheus.service=prometheus"
      - "traefik.http.services.prometheus.loadbalancer.server.port=9090"
      - "traefik.http.routers.prometheus-http.rule=Host(`prometheus-ssf.smart-village.solutions`)"
      - "traefik.http.routers.prometheus-http.entrypoints=web"
      - "traefik.http.routers.prometheus-http.middlewares=redirect-to-https"
      - "traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https"

  grafana:
    image: grafana/grafana:11.6.16
    restart: always
    depends_on:
      - prometheus
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_SECURITY_DISABLE_INITIAL_ADMIN_CREATION=false
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_INSTALL_PLUGINS=grafana-clickhouse-datasource 4.21.2
      - CLICKHOUSE_DB=${CLICKHOUSE_DB:?set CLICKHOUSE_DB in .env}
      - CLICKHOUSE_USER=${CLICKHOUSE_USER:?set CLICKHOUSE_USER in .env}
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD:?required}
    volumes:
      - ./monitoring/grafana:/var/lib/grafana
      - ./monitoring/grafana-provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana-dashboards:/var/lib/grafana/dashboards
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.grafana.rule=Host(`grafana-ssf.smart-village.solutions`)"
      - "traefik.http.routers.grafana.entrypoints=websecure"
      - "traefik.http.routers.grafana.tls=true"
      - "traefik.http.routers.grafana.tls.certresolver=le"
      - "traefik.http.routers.grafana.service=grafana"
      - "traefik.http.services.grafana.loadbalancer.server.port=3000"
      - "traefik.http.routers.grafana-http.rule=Host(`grafana-ssf.smart-village.solutions`)"
      - "traefik.http.routers.grafana-http.entrypoints=web"
      - "traefik.http.routers.grafana-http.middlewares=redirect-to-https"
      - "traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https"

  dcgm_exporter:
    image: nvidia/dcgm-exporter:4.8.3
    restart: always
    privileged: true
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      - DCGM_EXPORTER_LISTEN=0.0.0.0:9400
      - DCGM_EXPORTER_KUBERNETES=false
    expose:
      - "9400"

  cadvisor:
    image: ghcr.io/google/cadvisor:v0.60.5
    container_name: ssf-backend-cadvisor
    restart: always
    privileged: true
    expose:
      - "8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    devices:
      - /dev/kmsg
    command:
      - '--housekeeping_interval=10s'
      - '--store_container_labels=true'

  node_exporter:
    image: prom/node-exporter:v1.12.1
    container_name: ssf-backend-node-exporter
    restart: always
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/host/rootfs'
      - '--collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run|host|etc)($|/)'
      - '--collector.filesystem.fs-types-exclude=^(autofs|binfmt_misc|bpf|cgroup2?|configfs|debugfs|devpts|devtmpfs|fusectl|hugetlbfs|mqueue|nsfs|overlay|proc|pstore|rpc_pipefs|securityfs|squashfs|sysfs|tracefs|tmpfs)$'
    expose:
      - "9100"
    volumes:
      - /:/host/rootfs:ro,rslave
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro

  loki:
    image: grafana/loki:2.9.15
    restart: always
    command: -config.file=/etc/loki/config.yaml
    expose:
      - "3100"
    volumes:
      - ./monitoring/loki-config.yaml:/etc/loki/config.yaml:ro
      - ./monitoring/loki-data:/loki

  promtail:
    image: grafana/promtail:2.9.15
    restart: always
    command: -config.file=/etc/promtail/config.yaml -log.level=debug
    depends_on:
      - loki
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - ./monitoring/promtail-config.yaml:/etc/promtail/config.yaml:ro
      - ./monitoring/promtail-data:/var/lib/promtail

volumes:
  redis-data:
  ollama-data:
  audio-data:
  clickhouse-data:
  keycloak-postgres-data:
