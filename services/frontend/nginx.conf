# Map for conditional logging (must be outside server block)
map $request_uri $loggable {
    /health 0;
    default 1;
}

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml+rss;

    # Written at build time (services/frontend/security/). nginx drops server-level
    # add_header in any location with its own add_header, so each such location
    # includes the security headers again.
    include /etc/nginx/snippets/security-headers.conf;

    # SPA routing - serve index.html for all routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        try_files $uri =404;
    }

    # Not content-hashed, so revalidated on every load instead of cached for a year.
    location = /theme-init.js {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf|eot)$ {
        include /etc/nginx/snippets/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /health {
        include /etc/nginx/snippets/security-headers.conf;
        access_log off;
        add_header Content-Type text/plain;
        return 200 "healthy\n";
    }

    access_log /var/log/nginx/access.log combined if=$loggable;
}
