# The off-site replica of the archive store (spec §12.1). Runbook:
# docs/operations/runbooks/archive-storage-deployment.md
#
# The replica pulls from the primary: primary-sync reads new versions through
# the primary's filer (-a.filerProxy) over the private link and writes them
# here, never a deletion. The replica publishes only its S3 port, for restores,
# so the primary holds no credential for it and cannot reach it. A version
# rewritten below the primary's S3 API still reaches the replica (runbook).
#
#   replica_compose up -d                     (defined in the runbook)
#   replica_compose --profile retention up -d retention   (recording-retention-deployment.md)

name: ssf-archive-replica

x-seaweedfs-image: &seaweedfs-image chrislusf/seaweedfs@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d # 4.48

services:
  seaweedfs:
    image: *seaweedfs-image
    command: server -dir=/data -s3 -s3.config=/etc/seaweedfs/s3.json
    ports:
      - "${SSF_ARCHIVE_LISTEN_ADDRESS:?the address restores are run from}:8333:8333"
    volumes:
      - seaweedfs-data:/data
      - ${SSF_ARCHIVE_CONFIG_DIR:-/etc/ssf-archive}/seaweedfs:/etc/seaweedfs:ro
    restart: unless-stopped

  primary-sync:
    image: *seaweedfs-image
    command: >-
      filer.sync -a=${SSF_ARCHIVE_PRIMARY_FILER:?the primary's link address with port 8888}
      -a.filerProxy -b=seaweedfs:8888 -isActivePassive -b.doDeleteFiles=false
      -a.path=/buckets -b.path=/buckets -a.excludePaths=/buckets/.system
    depends_on:
      - seaweedfs
    restart: unless-stopped

  # The retention worker (#618), from the gateway image. It holds this site's
  # retention pair only and reaches ssf_recording over the link; the profile
  # keeps it off until the retention runbook turns it on.
  retention:
    profiles: [retention]
    image: ${SSF_RETENTION_IMAGE:-ssf-retention-image-unset}
    command: ["python", "-m", "services.api_gateway.recording.retention", "run"]
    read_only: true
    depends_on:
      - seaweedfs
    environment:
      SSF_RETENTION_SITE: replica
      SSF_RETENTION_ENDPOINT: http://seaweedfs:8333
      SSF_RETENTION_DATABASE_URL: ${SSF_RETENTION_DATABASE_URL:-}
    volumes:
      - /etc/ssf-archive/retention:/run/secrets/ssf-retention:ro
      - retention-state:/var/lib/ssf-retention
    tmpfs:
      - /tmp
    restart: unless-stopped

volumes:
  seaweedfs-data:
  # The worker's audit high-water mark and last sweep.
  retention-state:
