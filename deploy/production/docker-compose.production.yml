name: ssf-backend
services:
  traefik:
    image: traefik@sha256:ca0f90490fe3091f5f4e582a28638652edb3b26b4d7a1d9ee621ce88fb2bff86
    command:
    - --api.dashboard=true
    - --log.level=DEBUG
    - --providers.docker=true
    - --providers.docker.exposedbydefault=false
    - --providers.file.directory=/etc/traefik/dynamic
    - --providers.file.watch=true
    - --entrypoints.web.address=:80
    - --entrypoints.websecure.address=:443
    - --certificatesresolvers.le.acme.tlschallenge=true
    - --certificatesresolvers.le.acme.email=admin@smart-village.solutions
    - --certificatesresolvers.le.acme.storage=/letsencrypt/acme.json
    environment:
    - DOCKER_API_VERSION=1.41
    ports:
    - 80:80
    - 443:443
    volumes:
    - /var/run/docker.sock:/var/run/docker.sock:ro
    - ../../letsencrypt:/letsencrypt
    - ../../traefik/dynamic:/etc/traefik/dynamic:ro
    restart: unless-stopped
    pull_policy: never
  asr:
    expose:
    - '8000'
    volumes:
    - ../../models:/models
    deploy:
      resources:
        reservations:
          devices:
          - driver: nvidia
            count: all
            capabilities:
            - gpu
    image: ssf-backend-asr:prod-35c4b2f
    restart: unless-stopped
    pull_policy: never
  translation:
    expose:
    - '8000'
    volumes:
    - ../../models:/models
    deploy:
      resources:
        reservations:
          devices:
          - driver: nvidia
            count: all
            capabilities:
            - gpu
    image: ssf-backend-translation:prod-35c4b2f
    restart: unless-stopped
    pull_policy: never
  tts:
    expose:
    - '8000'
    volumes:
    - ../../models:/models
    deploy:
      resources:
        reservations:
          devices:
          - driver: nvidia
            count: all
            capabilities:
            - gpu
    image: ssf-backend-tts:prod-35c4b2f
    restart: unless-stopped
    pull_policy: never
  api_gateway:
    ports:
    - 8000:8000
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '1.0'
          memory: 1G
    volumes:
    - audio-data:/data/audio
    - type: tmpfs
      target: /tmp/audio
      tmpfs:
        size: 1G
    environment:
    - REDIS_URL=redis://redis:6379/0
    - REDIS_NAMESPACE=ssf
    - CLIENT_BASE_URL=https://dialog.kassel.de
    - AUDIO_STORAGE_PATH=/data/audio
    - AUDIO_RETENTION_HOURS=24
    - AUDIO_TEMP_PATH=/tmp/audio
    - AUDIO_MAX_DISK_USAGE_GB=9
    - AUDIO_CLEANUP_INTERVAL_MINUTES=60
    - ENABLE_PIPELINE_METADATA=true
    # Bounds concurrent GPU pipeline work. Set here, not left to the code
    # default, so the limit production runs on can be tuned from the env file
    # without a gateway build. Five is measured on this card (2026-09-24):
    # five concurrent conversations peaked at 15345 MiB of 20475, ASR p50
    # 0.52 s, translation plus refinement p95 1.96 s, nothing shed. The queue
    # wait must stay above that pipeline p95. 0 disables the bound.
    - MAX_CONCURRENT_PIPELINES=${MAX_CONCURRENT_PIPELINES:-5}
    - PIPELINE_QUEUE_WAIT_SECONDS=${PIPELINE_QUEUE_WAIT_SECONDS:-10.0}
    - LLM_REFINEMENT_ENABLED=${LLM_REFINEMENT_ENABLED:-true}
    # No default here: an explicit default would always win over the
    # backend-aware default translation_refiner.py resolves (ollama keeps
    # gpt-oss:20b, vllm gets qwen3.5-4b), breaking the one-variable switch.
    - LLM_REFINEMENT_MODEL=${LLM_REFINEMENT_MODEL-}
    - LLM_REFINEMENT_MODE=${LLM_REFINEMENT_MODE:-primary_only}
    - LLM_REFINEMENT_PRIMARY_MODEL=${LLM_REFINEMENT_PRIMARY_MODEL-}
    - LLM_REFINEMENT_CANDIDATE_MODEL=${LLM_REFINEMENT_CANDIDATE_MODEL:-phi4-mini}
    - LLM_REFINEMENT_SHADOW_QUEUE_LIMIT=${LLM_REFINEMENT_SHADOW_QUEUE_LIMIT:-4}
    # Blank, not defaulted to Ollama's address: an explicit value here would
    # always win over LLM_REFINEMENT_BACKEND's own endpoint default, which
    # would break the one-variable backend switch.
    - LLM_REFINEMENT_ENDPOINT=${LLM_REFINEMENT_ENDPOINT:-}
    - LLM_REFINEMENT_TIMEOUT=${LLM_REFINEMENT_TIMEOUT:-4.0}
    - LLM_REFINEMENT_TEMPERATURE=${LLM_REFINEMENT_TEMPERATURE:-0.0}
    - LLM_REFINEMENT_THINK=${LLM_REFINEMENT_THINK:-false}
    - LLM_REFINEMENT_MAX_RETRIES=${LLM_REFINEMENT_MAX_RETRIES:-1}
    - LLM_REFINEMENT_BACKEND=${LLM_REFINEMENT_BACKEND:-ollama}
    - LLM_REFINEMENT_MAX_TOKENS=${LLM_REFINEMENT_MAX_TOKENS:-256}
    # No colon before the dash: an explicitly empty value must survive so
    # "refine everything" is reachable through compose (see I4).
    - LLM_REFINEMENT_SKIP_TARGET_LANGUAGES=${LLM_REFINEMENT_SKIP_TARGET_LANGUAGES-am,ti,ku,fa}
    - GLOBAL_RATE_LIMIT=${GLOBAL_RATE_LIMIT:-1200}
    - GLOBAL_RATE_WINDOW_SECONDS=${GLOBAL_RATE_WINDOW_SECONDS:-60}
    - MESSAGE_RATE_LIMIT=${MESSAGE_RATE_LIMIT:-50}
    - MESSAGE_RATE_WINDOW_SECONDS=${MESSAGE_RATE_WINDOW_SECONDS:-10}
    - ENVIRONMENT=${ENVIRONMENT:-production}
    - DEVELOPMENT_CORS_ORIGINS=${DEVELOPMENT_CORS_ORIGINS:-http://localhost:5173,http://localhost:5174}
    - KEYCLOAK_BASE_URL=${KEYCLOAK_BASE_URL:-https://auth.dialog.kassel.de}
    - KEYCLOAK_AUDIENCE=${KEYCLOAK_AUDIENCE:-ssf-frontend}
    - KEYCLOAK_REQUIRED_ROLE=${KEYCLOAK_REQUIRED_ROLE:-ssf-user}
    - STUDIO_RUNTIME_CONFIGURATION_BASE_URL=${STUDIO_RUNTIME_CONFIGURATION_BASE_URL:-https://studio.dialog.kassel.de}
    - STUDIO_RUNTIME_TOKEN_URL=${STUDIO_RUNTIME_TOKEN_URL:?required}
    - STUDIO_RUNTIME_CLIENT_ID=${STUDIO_RUNTIME_CLIENT_ID:-ssf-runtime}
    - STUDIO_RUNTIME_AUDIENCE=${STUDIO_RUNTIME_AUDIENCE:-sva-studio-ssf-runtime}
    - STUDIO_RUNTIME_CLIENT_SECRET=${STUDIO_RUNTIME_CLIENT_SECRET:?required}
    - STUDIO_LOGIN_DIRECTORY_CACHE_SECONDS=${STUDIO_LOGIN_DIRECTORY_CACHE_SECONDS:-60}
    - SSF_SESSION_RECONNECT_GRACE_MINUTES=30
    - SSF_SESSION_TIMEOUT_WARNING_MINUTES=5
    - SSF_SESSION_MAX_HOURS=8
    - SSF_QUALITY_TELEMETRY_MODE=${SSF_QUALITY_TELEMETRY_MODE:-disabled}
    - SSF_QUALITY_TELEMETRY_SESSION_KEY=${SSF_QUALITY_TELEMETRY_SESSION_KEY:-}
    # Two roles, not one: the request path is filtered by the tenant policy,
    # the background passes are deployment-wide. See migration 002.
    # The passwords are passed beside these URLs, not inside them: a
    # generated password is not URL-safe, and asyncpg parses a DSN as a
    # URL. See PostgresFeedbackRepository.create.
    - SSF_FEEDBACK_DATABASE_URL=postgresql://ssf_feedback_app@ssf-postgres:5432/${SSF_POSTGRES_DB}
    - SSF_FEEDBACK_DATABASE_PASSWORD=${SSF_FEEDBACK_APP_PASSWORD}
    - SSF_FEEDBACK_MAINTENANCE_DATABASE_URL=postgresql://ssf_feedback_maintenance@ssf-postgres:5432/${SSF_POSTGRES_DB}
    - SSF_FEEDBACK_MAINTENANCE_DATABASE_PASSWORD=${SSF_FEEDBACK_MAINTENANCE_PASSWORD}
    - SSF_FEEDBACK_READER_DATABASE_URL=postgresql://ssf_feedback_reader@ssf-postgres:5432/${SSF_POSTGRES_DB}
    - SSF_FEEDBACK_READER_DATABASE_PASSWORD=${SSF_FEEDBACK_READER_PASSWORD}
    - SSF_FEEDBACK_ENCRYPTION_KEY=${SSF_FEEDBACK_ENCRYPTION_KEY:?required}
    - SSF_DEFAULT_TENANT_ID=${SSF_DEFAULT_TENANT_ID:-default}
    # How long after a conversation ends its feedback is still accepted. The
    # feedback button sits in the ended-conversation screen's header, and the
    # ended session's join link is already revoked by then.
    - SSF_FEEDBACK_GRACE_MINUTES=${SSF_FEEDBACK_GRACE_MINUTES:-30}
    - SSF_OTLP_LOGS_ENDPOINT=${SSF_OTLP_LOGS_ENDPOINT:-http://otel-collector:4318/v1/logs}
    - SSF_RELEASE_VERSION=${SSF_RELEASE_VERSION:-unknown}
    - SSF_DEPLOYMENT_ENV=${SSF_DEPLOYMENT_ENV:-production}
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:8000/health
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: 100m
        max-file: '5'
    depends_on:
      redis:
        condition: service_started
      ollama:
        condition: service_started
      ssf-postgres:
        condition: service_started
    labels:
    - traefik.enable=true
    - traefik.http.routers.api_gateway.rule=Host(`ssf.smart-village.solutions`)
    - traefik.http.routers.api_gateway.entrypoints=websecure
    - traefik.http.routers.api_gateway.tls.certresolver=le
    - traefik.http.services.api_gateway.loadbalancer.server.port=8000
    - traefik.http.services.api_gateway.loadbalancer.passhostheader=true
    - traefik.http.middlewares.websocket-headers.headers.customrequestheaders.X-Forwarded-Proto=https
    restart: unless-stopped
    image: ssf-backend-api_gateway:prod-bb3037f
    pull_policy: never
  ollama:
    image: ollama/ollama@sha256:57f573b47f1f71ebb445789f279fe3e596a8beab182f7cf486db9205bad87c5a
    expose:
    - '11434'
    environment:
    - OLLAMA_HOST=0.0.0.0
    volumes:
    - ollama-data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
          - driver: nvidia
            count: all
            capabilities:
            - gpu
    restart: unless-stopped
    pull_policy: never
  vllm:
    # The production gateway uses vLLM for refinement, so routine deployments
    # must keep this GPU-reserving service running.
    image: vllm/vllm-openai@sha256:8a69ffad015f138d7170c4ddc429e230a3bc1c1719f67e14324749df200a4b90
    expose:
    - '8000'
    environment:
    - HF_HOME=/models
    volumes:
    - vllm-models:/models
    ipc: host
    command:
    - --model=${LLM_REFINEMENT_MODEL_REPO:-Qwen/Qwen3.5-4B}
    # Matches the gateway's own resolution order (translation_refiner.py
    # prefers LLM_REFINEMENT_PRIMARY_MODEL), so one variable configures
    # both sides. Do not read LLM_REFINEMENT_MODEL here: that would let
    # the name vLLM serves drift from the name the gateway requests.
    - --served-model-name=${LLM_REFINEMENT_PRIMARY_MODEL:-qwen3.5-4b}
    - --max-model-len=${VLLM_MAX_MODEL_LEN:-4096}
    - --max-num-seqs=${VLLM_MAX_NUM_SEQS:-8}
    # fp8 and 0.40 are measured (2026-09-23): weights 5.09 GiB, peak
    # activation 1.36 GiB, KV cache 1.16 GiB, 5.3 GiB of the card free.
    # The unquantized/0.58 combination was the pre-measurement guess and
    # left negative room for KV cache on the Gemma build that was rejected.
    - --quantization=${VLLM_QUANTIZATION:-fp8}
    - --gpu-memory-utilization=${VLLM_GPU_MEMORY_UTILIZATION:-0.40}
    # Explicit even though it is vLLM's own default: the model must never
    # spill into system RAM, so this is a fixed flag, not a variable
    # someone could override unknowingly.
    - --cpu-offload-gb=0
    - '--limit-mm-per-prompt={"image": 0, "audio": 0}'
    healthcheck:
      test:
      - CMD
      - python3
      - -c
      - import urllib.request; urllib.request.urlopen('http://localhost:8000/health')
      interval: 30s
      timeout: 5s
      retries: 20
      start_period: 300s
    deploy:
      resources:
        reservations:
          devices:
          - driver: nvidia
            count: all
            capabilities:
            - gpu
    restart: unless-stopped
    pull_policy: never
  redis:
    image: redis@sha256:3b73847e72874be07e6657b129a94761662b79bc0f679273757d4218573b2a98
    command:
    - redis-server
    - --appendonly
    - 'yes'
    expose:
    - '6379'
    volumes:
    - redis-data:/data
    restart: unless-stopped
    pull_policy: never
  clickhouse:
    image: clickhouse/clickhouse-server@sha256:2ef11bbe2e44ab7022f37ff3019b3f2125ed09e919ea6194660be6130b7ca4b7
    restart: unless-stopped
    expose:
    - '8123'
    - '9000'
    environment:
    - CLICKHOUSE_DB=${CLICKHOUSE_DB:?set CLICKHOUSE_DB in .env}
    - CLICKHOUSE_USER=${CLICKHOUSE_USER:?set CLICKHOUSE_USER in .env}
    - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD:?required}
    - CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
    - clickhouse-data:/var/lib/clickhouse
    - ../../deploy/clickhouse:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
      - CMD-SHELL
      - wget -qO- http://localhost:8123/ping | grep -qx 'Ok.'
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    pull_policy: never
  otel-collector:
    image: otel/opentelemetry-collector-contrib@sha256:1f2c54a30e713fac6b3ae77a1ec84010c2007e29ced8ec666214fc2f6739c1cc
    restart: unless-stopped
    command:
    - --config=/etc/otelcol-contrib/config.yaml
    expose:
    - '4318'
    - '13133'
    - '8888'
    environment:
    - CLICKHOUSE_DB=${CLICKHOUSE_DB:?set CLICKHOUSE_DB in .env}
    - CLICKHOUSE_USER=${CLICKHOUSE_USER:?set CLICKHOUSE_USER in .env}
    - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD:?required}
    volumes:
    - ../../monitoring/otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    depends_on:
      clickhouse:
        condition: service_healthy
    pull_policy: never
  ssf-postgres:
    image: postgres@sha256:bb377b7239d2774ac8cc76f481596ce96c5a6b5e9d141f6d0a0ee371a6e7c0f2
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${SSF_POSTGRES_DB:?required}
      POSTGRES_USER: ${SSF_POSTGRES_USER:?required}
      POSTGRES_PASSWORD: ${SSF_POSTGRES_PASSWORD:?required}
      # apply.sh sets these on the two application roles in migration 002. The
      # owner above runs migrations and backups only; nothing connects as it at
      # runtime, because a superuser bypasses the tenant policy entirely.
      SSF_FEEDBACK_APP_PASSWORD: ${SSF_FEEDBACK_APP_PASSWORD:?required}
      SSF_FEEDBACK_MAINTENANCE_PASSWORD: ${SSF_FEEDBACK_MAINTENANCE_PASSWORD:?required}
      SSF_FEEDBACK_READER_PASSWORD: ${SSF_FEEDBACK_READER_PASSWORD:?required}
    volumes:
    - ssf-postgres-data:/var/lib/postgresql/data
    - ../../deploy/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    pull_policy: never
  keycloak-postgres:
    image: postgres@sha256:bb377b7239d2774ac8cc76f481596ce96c5a6b5e9d141f6d0a0ee371a6e7c0f2
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${KEYCLOAK_DB_NAME:?required}
      POSTGRES_USER: ${KEYCLOAK_DB_USER:?required}
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?required}
    volumes:
    - keycloak-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    pull_policy: never
  keycloak:
    image: ssf-keycloak:prod-59c954c
    command:
    - start
    - --optimized
    restart: unless-stopped
    expose:
    - '8080'
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: keycloak-postgres
      KC_DB_URL_DATABASE: ${KEYCLOAK_DB_NAME:?required}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER:?required}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?required}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_BOOTSTRAP_ADMIN_USERNAME:?required}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_BOOTSTRAP_ADMIN_PASSWORD:?required}
      KC_HOSTNAME: https://auth.dialog.kassel.de
      KC_PROXY_HEADERS: xforwarded
      KC_HTTP_ENABLED: 'true'
      KC_HEALTH_ENABLED: 'true'
    depends_on:
      keycloak-postgres:
        condition: service_healthy
    healthcheck:
      test:
      - CMD-SHELL
      - 'bash -ec ''exec 3<>/dev/tcp/127.0.0.1/9000; printf "GET /health/ready HTTP/1.1\r\nHost:
        localhost\r\nConnection: close\r\n\r\n" >&3; grep -q "200 OK" <&3'''
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    labels:
    - traefik.enable=true
    - traefik.http.routers.keycloak.rule=Host(`auth.dialog.kassel.de`)
    - traefik.http.routers.keycloak.entrypoints=websecure
    - traefik.http.routers.keycloak.tls.certresolver=le
    - traefik.http.services.keycloak.loadbalancer.server.port=8080
    pull_policy: never
  frontend:
    networks:
    - default
    labels:
    - traefik.enable=true
    - traefik.http.routers.frontend.rule=Host(`dialog.kassel.de`)
    - traefik.http.routers.frontend.entrypoints=websecure
    - traefik.http.routers.frontend.tls.certresolver=le
    - traefik.http.services.frontend.loadbalancer.server.port=8080
    - traefik.docker.network=ssf-backend_default
    restart: unless-stopped
    image: ssf-backend-frontend:prod-bb3037f
    pull_policy: never
  prometheus:
    image: prom/prometheus@sha256:63805ebb8d2b3920190daf1cb14a60871b16fd38bed42b857a3182bc621f4996
    volumes:
    - ../../monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    - ../../monitoring/alert_rules.yml:/etc/prometheus/alert_rules.yml
    - prometheus-data:/prometheus
    expose:
    - '9090'
    labels:
    - traefik.enable=true
    - traefik.http.routers.prometheus.rule=Host(`prometheus-ssf.smart-village.solutions`)
    - traefik.http.routers.prometheus.entrypoints=websecure
    - traefik.http.routers.prometheus.tls=true
    - traefik.http.routers.prometheus.tls.certresolver=le
    - traefik.http.routers.prometheus.service=prometheus
    - traefik.http.services.prometheus.loadbalancer.server.port=9090
    - traefik.http.routers.prometheus-http.rule=Host(`prometheus-ssf.smart-village.solutions`)
    - traefik.http.routers.prometheus-http.entrypoints=web
    - traefik.http.routers.prometheus-http.middlewares=redirect-to-https
    - traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https
    restart: unless-stopped
    pull_policy: never
  grafana:
    image: grafana/grafana@sha256:6b5b37eb35bbf30e7f64bd7f0fd41c0a5b7637f65d3bf93223b04a192b8bf3e2
    restart: unless-stopped
    depends_on:
    - prometheus
    environment:
    - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
    - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
    - GF_SECURITY_DISABLE_INITIAL_ADMIN_CREATION=false
    - GF_USERS_ALLOW_SIGN_UP=false
    - GF_INSTALL_PLUGINS=grafana-clickhouse-datasource 4.21.2
    - CLICKHOUSE_DB=${CLICKHOUSE_DB:?set CLICKHOUSE_DB in .env}
    - CLICKHOUSE_USER=${CLICKHOUSE_USER:?set CLICKHOUSE_USER in .env}
    - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD:?required}
    volumes:
    - ../../monitoring/grafana:/var/lib/grafana
    - ../../monitoring/grafana-provisioning:/etc/grafana/provisioning:ro
    - ../../monitoring/grafana-dashboards:/var/lib/grafana/dashboards
    labels:
    - traefik.enable=true
    - traefik.http.routers.grafana.rule=Host(`grafana-ssf.smart-village.solutions`)
    - traefik.http.routers.grafana.entrypoints=websecure
    - traefik.http.routers.grafana.tls=true
    - traefik.http.routers.grafana.tls.certresolver=le
    - traefik.http.routers.grafana.service=grafana
    - traefik.http.services.grafana.loadbalancer.server.port=3000
    - traefik.http.routers.grafana-http.rule=Host(`grafana-ssf.smart-village.solutions`)
    - traefik.http.routers.grafana-http.entrypoints=web
    - traefik.http.routers.grafana-http.middlewares=redirect-to-https
    - traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https
    pull_policy: never
  dcgm_exporter:
    image: nvidia/dcgm-exporter@sha256:a1d913783fd185d78ed8b725334f75adc86eb594afe82961a73aa63c5d0ef423
    restart: unless-stopped
    privileged: true
    deploy:
      resources:
        reservations:
          devices:
          - driver: nvidia
            count: all
            capabilities:
            - gpu
    environment:
    - DCGM_EXPORTER_LISTEN=0.0.0.0:9400
    - DCGM_EXPORTER_KUBERNETES=false
    expose:
    - '9400'
    pull_policy: never
  cadvisor:
    image: gcr.io/cadvisor/cadvisor@sha256:adc29827d88730174181e9fe221938323baa6ba8c5734c2ec52aa2e86a0c303e
    container_name: ssf-backend-cadvisor
    restart: unless-stopped
    privileged: true
    expose:
    - '8080'
    volumes:
    - /:/rootfs:ro
    - /var/run:/var/run:ro
    - /sys:/sys:ro
    - /var/lib/docker:/var/lib/docker:ro
    - /dev/disk:/dev/disk:ro
    devices:
    - /dev/kmsg
    command:
    - --housekeeping_interval=10s
    - --store_container_labels=true
    pull_policy: never
  node_exporter:
    image: prom/node-exporter@sha256:fa7fa12a57eff607176d5c363d8bb08dfbf636b36ac3cb5613a202f3c61a6631
    container_name: ssf-backend-node-exporter
    restart: unless-stopped
    command:
    - --path.procfs=/host/proc
    - --path.sysfs=/host/sys
    - --path.rootfs=/host/rootfs
