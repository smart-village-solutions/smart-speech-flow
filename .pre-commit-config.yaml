# Pre-commit Hooks Configuration
# Automatisiert Code-Qualitätsprüfungen vor jedem Commit

repos:
  # Python Code Formatting
  # Every rev in this file matches the pin in requirements-dev.txt, which is
  # what CI installs. A shared config is not enough on its own: two Black
  # releases disagree about this codebase, so a different rev here rewrites
  # files that CI then rejects.
  - repo: https://github.com/psf/black
    rev: 26.5.1
    hooks:
      # No line-length arg: Black reads [tool.black] in pyproject.toml.
      - id: black
        language_version: python3.12
        files: ^services/.*\.py$

  # Import Sorting
  - repo: https://github.com/PyCQA/isort
    rev: 9.0.1
    hooks:
      # No args: isort reads [tool.isort] in pyproject.toml.
      - id: isort
        files: ^services/.*\.py$

  # Python Linting
  - repo: https://github.com/PyCQA/flake8
    rev: 7.3.0
    hooks:
      - id: flake8
        files: ^services/.*\.py$
        # Pinned: an unpinned plugin floats to a release with new rules and
        # fails pre-commit on code CI accepts, or the reverse.
        additional_dependencies:
          - flake8-bugbear==26.9.9
          - flake8-docstrings==1.7.0
          - pep8-naming==0.15.1

  # Static Type Checking
  # pass_filenames is off and the path is explicit so this checks the same
  # scope CI checks: a per-file mypy invocation resolves imports differently
  # and reports a different set of errors. The hook's venv holds only mypy and
  # these stubs, so it is not byte-for-byte the CI environment.
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.3.1
    hooks:
      - id: mypy
        pass_filenames: false
        args: [services/api_gateway/, --ignore-missing-imports]
        additional_dependencies: [types-requests, types-redis]

  # Security Analysis
  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.4
    hooks:
      - id: bandit
        args: [-r, --severity-level, high]
        files: ^services/.*\.py$
        exclude: ^services/.*/tests/.*$

  # General File Checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      # Prevent large files from being committed
      - id: check-added-large-files
        args: [--maxkb=1000]

      # Ensure files end with newline
      - id: end-of-file-fixer
        files: \.(py|yaml|yml|json|md|txt|sh)$

      # Remove trailing whitespace
      - id: trailing-whitespace
        files: \.(py|yaml|yml|json|md|txt|sh)$

      # Check YAML syntax
      - id: check-yaml
        files: \.(yaml|yml)$
        exclude: ^docker-compose\.yml$  # May have template syntax

      # Check JSON syntax
      - id: check-json
        files: \.json$
        exclude: ^(response\.json|services/frontend/tsconfig.*\.json)$

      # Check for merge conflicts
      - id: check-merge-conflict

      # Check Python AST (syntax)
      - id: check-ast
        files: \.py$

      # Check for debugger imports
      - id: debug-statements
        files: \.py$

  # Dependency Security Scanning
  - repo: https://github.com/Lucas-C/pre-commit-hooks-safety
    rev: v1.3.2
    hooks:
      - id: python-safety-dependencies-check
        files: requirements.*\.txt$
        # Torch pins cuda-toolkit 13.0.3.0. CVE-2025-33228 is confined to
        # manual Nsight gfx_hotspot recipe execution, which these services do
        # not install or invoke; no compatible Torch release carries 13.1 yet.
        args: [--ignore, SFTY-20260120-40557]

# Configuration for specific hooks
default_language_version:
  python: python3.12

# Files to exclude globally
exclude: |
  (?x)^(
    \.venv/.*|
    __pycache__/.*|
    \.git/.*|
    \.pytest_cache/.*|
    \.mypy_cache/.*|
    monitoring/.*|
    letsencrypt/.*|
    examples/.*
  )$

# Fail fast - stop on first failure
fail_fast: false

# Minimum pre-commit version required
minimum_pre_commit_version: 3.0.0
