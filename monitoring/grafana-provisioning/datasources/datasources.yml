apiVersion: 1

deleteDatasources:
  - name: Prometheus
    orgId: 1
  - name: Loki
    orgId: 1
  - name: ClickHouse
    orgId: 1

datasources:
  - name: Prometheus
    uid: prometheus-ssf
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      httpMethod: POST
      timeInterval: 15s

  - name: Loki
    uid: loki-ssf
    type: loki
    access: proxy
    url: http://loki:3100
    editable: false

  - name: ClickHouse
    uid: clickhouse-ssf
    type: grafana-clickhouse-datasource
    access: proxy
    editable: false
    jsonData:
      host: clickhouse
      port: 9000
      protocol: native
      defaultDatabase: $CLICKHOUSE_DB
      username: $CLICKHOUSE_USER
    secureJsonData:
      password: $CLICKHOUSE_PASSWORD
