# Unit tests for the alert rules that promtool cannot verify by parsing
# alone. Run with:
#   docker run --rm --entrypoint promtool -v "$PWD/monitoring:/m" \
#     prom/prometheus:latest test rules /m/alert_rules_test.yml
#
# RefinementFailureRateHigh exists because outcomes otherwise reach only
# ClickHouse, which dashboards query but alerting does not: a refiner that
# failed every request for weeks went unnoticed for exactly that reason. Its
# first version compared rates over short windows and never fired against
# the real traffic shape (a handful of messages a day) -- these cases pin
# down the replacement against that shape and its neighbours.
rule_files:
  - alert_rules.yml

evaluation_interval: 1m

tests:
  # Production shape: one failing attempt, no successes, ever. The alert
  # must become firing once `for: 15m` has elapsed.
  - interval: 1m
    input_series:
      - series: 'refinement_attempts_total{outcome="error",model_ref="gemma-4-e4b-qat"}'
        values: "0 1+0x40"
      - series: 'refinement_attempts_total{outcome="success",model_ref="gemma-4-e4b-qat"}'
        values: "0+0x41"
    alert_rule_test:
      - eval_time: 20m
        alertname: RefinementFailureRateHigh
        exp_alerts:
          - exp_labels:
              severity: warning
              service: translation
            exp_annotations:
              summary: "Refinement attempts are happening and none are succeeding"
              description: >-
                Every refinement attempt in the last 6 hours has failed and none
                has succeeded. Refinement fails open, so users still receive the
                translation, but unpolished. Check that the refinement backend is
                up and that the model is resident.

  # Successes exist alongside errors: the alert must never fire, at no point
  # in the run.
  - interval: 1m
    input_series:
      - series: 'refinement_attempts_total{outcome="error",model_ref="gemma-4-e4b-qat"}'
        values: "0 1+0x40"
      - series: 'refinement_attempts_total{outcome="success",model_ref="gemma-4-e4b-qat"}'
        values: "0 0 1+0x39"
    alert_rule_test:
      - eval_time: 20m
        alertname: RefinementFailureRateHigh
        exp_alerts: []

  # The error series springs into existence at 1, with no preceding zero
  # sample to increase() from -- the shape a restart produces without
  # refinement_metrics.pre_create_series. A single failure frozen at that
  # value is genuinely invisible to increase() (Prometheus cannot tell "just
  # started at 1" from "has always been 1"): that is the bug I3 fixes by
  # pre-creating the zero sample. This case instead pins the next line of
  # defence -- once failures keep happening every minute, increase() catches
  # the ongoing rate even without ever having seen a zero sample, so the
  # alert does not stay blind past the very first occurrence.
  - interval: 1m
    input_series:
      - series: 'refinement_attempts_total{outcome="error",model_ref="gemma-4-e4b-qat"}'
        values: "1+1x40"
    alert_rule_test:
      - eval_time: 20m
        alertname: RefinementFailureRateHigh
        exp_alerts:
          - exp_labels:
              severity: warning
              service: translation
            exp_annotations:
              summary: "Refinement attempts are happening and none are succeeding"
              description: >-
                Every refinement attempt in the last 6 hours has failed and none
                has succeeded. Refinement fails open, so users still receive the
                translation, but unpolished. Check that the refinement backend is
                up and that the model is resident.

  # No attempts at all: an idle deployment must not alert.
  - interval: 1m
    input_series: []
    alert_rule_test:
      - eval_time: 20m
        alertname: RefinementFailureRateHigh
        exp_alerts: []

  # vLLM is a separate target from the gateway. Its model can be absent while
  # raw translation still succeeds, so target loss needs its own alert.
  - interval: 1m
    input_series:
      - series: 'up{job="vllm",instance="vllm:8000"}'
        values: "0+0x10"
    alert_rule_test:
      - eval_time: 4m
        alertname: VllmTargetDown
        exp_alerts: []
      - eval_time: 5m
        alertname: VllmTargetDown
        exp_alerts:
          - exp_labels:
              instance: vllm:8000
              job: vllm
              severity: critical
              service: vllm
            exp_annotations:
              summary: "vLLM is not answering Prometheus"
              description: >-
                Prometheus has failed to scrape vllm:8000 for 5 minutes.
                Translation refinement is unavailable; raw translations still
                succeed without refinement.
              runbook_url: "https://github.com/smart-village-solutions/smart-speech-flow/blob/main/docs/operations/runbooks/service-down-alerts.md"

  # TTSVRAMOverBudget: every reading in a 5m window above the budget, for
  # 15m. Growth from minute 6 fills its first window at 10m and fires at 25m;
  # the checks stay clear of that edge.
  - interval: 1m
    input_series:
      - series: 'tts_process_vram_bytes{job="tts",instance="tts:8000"}'
        values: "1500000000+0x5 2200000000+0x35"
      - series: 'tts_vram_budget_bytes{job="tts",instance="tts:8000"}'
        values: "2147483648+0x40"
    alert_rule_test:
      - eval_time: 20m
        alertname: TTSVRAMOverBudget
        exp_alerts: []
      - eval_time: 30m
        alertname: TTSVRAMOverBudget
        exp_alerts:
          - exp_labels:
              severity: warning
              service: tts
              job: tts
              instance: tts:8000
            exp_annotations:
              summary: TTS holds more VRAM than its budget.
              description: >-
                tts_process_vram_bytes has stayed above tts_vram_budget_bytes
                (TTS_VRAM_BUDGET_MIB) for 20 minutes. The "vram" block of the TTS
                /health response shows what each voice cost to load. Restarting
                the tts container returns it to its resident footprint.
      - eval_time: 30m
        alertname: TTSVRAMUnknown
        exp_alerts: []

  # NVML failing now and then must not reset the pending window: NaN
  # samples are skipped, so the over-budget readings between them still fire.
  - interval: 1m
    input_series:
      - series: 'tts_process_vram_bytes{job="tts",instance="tts:8000"}'
        values: "NaN 2200000000 2200000000 NaN 2200000000 2200000000 NaN 2200000000 2200000000 NaN 2200000000 2200000000 NaN 2200000000 2200000000 NaN 2200000000 2200000000 NaN 2200000000 2200000000 NaN 2200000000 2200000000 NaN 2200000000 2200000000 NaN 2200000000 2200000000 NaN 2200000000 2200000000 NaN 2200000000 2200000000 NaN 2200000000 2200000000 NaN 2200000000"
      - series: 'tts_vram_budget_bytes{job="tts",instance="tts:8000"}'
        values: "2147483648+0x40"
    alert_rule_test:
      - eval_time: 25m
        alertname: TTSVRAMOverBudget
        exp_alerts:
          - exp_labels:
              severity: warning
              service: tts
              job: tts
              instance: tts:8000
            exp_annotations:
              summary: TTS holds more VRAM than its budget.
              description: >-
                tts_process_vram_bytes has stayed above tts_vram_budget_bytes
                (TTS_VRAM_BUDGET_MIB) for 20 minutes. The "vram" block of the TTS
                /health response shows what each voice cost to load. Restarting
                the tts container returns it to its resident footprint.

  # Synthesis peaks above the budget, however often, never fill a window.
  - interval: 1m
    input_series:
      - series: 'tts_process_vram_bytes{job="tts",instance="tts:8000"}'
        values: "2200000000 1500000000 1500000000 1500000000 2200000000 1500000000 1500000000 1500000000 2200000000 1500000000 1500000000 1500000000 2200000000 1500000000 1500000000 1500000000 2200000000 1500000000 1500000000 1500000000 2200000000 1500000000 1500000000 1500000000 2200000000 1500000000 1500000000 1500000000 2200000000 1500000000 1500000000 1500000000 2200000000 1500000000 1500000000 1500000000 2200000000 1500000000 1500000000 1500000000 2200000000"
      - series: 'tts_vram_budget_bytes{job="tts",instance="tts:8000"}'
        values: "2147483648+0x40"
    alert_rule_test:
      - eval_time: 40m
        alertname: TTSVRAMOverBudget
        exp_alerts: []

  # TTSVRAMUnknown: NVML has not reported the process for 30m, so the
  # over-budget alert is blind.
  - interval: 1m
    input_series:
      - series: 'tts_process_vram_bytes{job="tts",instance="tts:8000"}'
        values: "NaN+0x40"
      - series: 'tts_vram_budget_bytes{job="tts",instance="tts:8000"}'
        values: "2147483648+0x40"
    alert_rule_test:
      - eval_time: 25m
        alertname: TTSVRAMUnknown
        exp_alerts: []
      - eval_time: 35m
        alertname: TTSVRAMUnknown
        exp_alerts:
          - exp_labels:
              severity: warning
              service: tts
              job: tts
              instance: tts:8000
            exp_annotations:
              summary: TTS cannot read its own VRAM.
              description: >-
                tts_process_vram_bytes has been NaN for 30 minutes: NVML does
                not report the TTS process, so TTSVRAMOverBudget cannot fire.
                Check inside the tts container that NVML's compute-process
                list shows the server under its container PID.
      - eval_time: 35m
        alertname: TTSVRAMOverBudget
        exp_alerts: []

  # Delivery audio (#426, #615). The pass runs hourly and stamps
  # audio_cleanup_last_run_timestamp_seconds, deleting nothing on a quiet
  # deployment. That must not alert.
  - interval: 1m
    input_series:
      - series: 'audio_cleanup_last_run_timestamp_seconds{job="api_gateway",instance="api_gateway:8000"}'
        values: "0+0x59 3600+0x59 7200+0x59 10800+0x59 14400+0x59"
      - series: 'audio_cleanup_deleted_files_total{job="api_gateway",instance="api_gateway:8000",directory="original"}'
        values: "0+0x299"
      - series: 'audio_cleanup_errors_total{job="api_gateway",instance="api_gateway:8000"}'
        values: "0+0x299"
    alert_rule_test:
      - eval_time: 299m
        alertname: AudioCleanupNotRunning
        exp_alerts: []
      - eval_time: 299m
        alertname: AudioCleanupErrors
        exp_alerts: []

  # The gateway is up but the pass stopped after its first run: stale for
  # 2.5h, then the 1h hold.
  - interval: 1m
    input_series:
      - series: 'audio_cleanup_last_run_timestamp_seconds{job="api_gateway",instance="api_gateway:8000"}'
        values: "0+0x299"
    alert_rule_test:
      - eval_time: 205m
        alertname: AudioCleanupNotRunning
        exp_alerts: []
      - eval_time: 215m
        alertname: AudioCleanupNotRunning
        exp_alerts:
          - exp_labels:
              severity: warning
              component: audio-storage
            exp_annotations:
              summary: The audio cleanup pass has stopped reporting.
              description: >-
                No cleanup pass has completed for more than two and a half
                hours, so delivery audio and transcripts that an ended session
                left behind may not be deleted. Check the gateway log for the
                hourly Audio-Cleanup line and for an error from the pass.

  # A pass that never completed: the gauge keeps the gateway's start time,
  # here 0, and the alert waits the same 2.5h + 1h as for a stalled pass.
  - interval: 1m
    input_series:
      - series: 'audio_cleanup_last_run_timestamp_seconds{job="api_gateway",instance="api_gateway:8000"}'
        values: "0+0x299"
      - series: 'up{job="api_gateway",instance="api_gateway:8000"}'
        values: "1+0x299"
    alert_rule_test:
      - eval_time: 205m
        alertname: AudioCleanupNotRunning
        exp_alerts: []
      - eval_time: 215m
        alertname: AudioCleanupNotRunning
        exp_alerts:
          - exp_labels:
              severity: warning
              component: audio-storage
            exp_annotations:
              summary: The audio cleanup pass has stopped reporting.
              description: >-
                No cleanup pass has completed for more than two and a half
                hours, so delivery audio and transcripts that an ended session
                left behind may not be deleted. Check the gateway log for the
                hourly Audio-Cleanup line and for an error from the pass.

  # The gateway is down: no audio series at all. APIGatewayScrapeDown reports
  # that; this alert must not repeat it.
  - interval: 1m
    input_series:
      - series: 'up{job="api_gateway",instance="api_gateway:8000"}'
        values: "0+0x299"
    alert_rule_test:
      - eval_time: 299m
        alertname: AudioCleanupNotRunning
        exp_alerts: []

  # The pass runs but cannot delete, as with the once root-owned audio volume.
  - interval: 1m
    input_series:
      - series: 'audio_cleanup_errors_total{job="api_gateway",instance="api_gateway:8000"}'
        values: "0+0x59 3+0x60"
    alert_rule_test:
      - eval_time: 70m
        alertname: AudioCleanupErrors
        exp_alerts: []
      - eval_time: 80m
        alertname: AudioCleanupErrors
        exp_alerts:
          - exp_labels:
              severity: warning
              component: audio-storage
            exp_annotations:
              summary: The audio cleanup pass cannot delete expired delivery audio.
              description: >-
                3 failed deletions in the last two hours. Each hourly pass
                retries the same files, so this counts attempts, not files; the
                audio outlives its session until it clears. The gateway log
                names the failure; a tmpfs the gateway's user cannot write or
                read is the usual cause.

  # A window whose first sample is already non-zero: increase() extrapolates
  # 3 failures to about 3.025, and the description still says 3.
  - interval: 1m
    input_series:
      - series: 'audio_cleanup_errors_total{job="api_gateway",instance="api_gateway:8000"}'
        values: "0+0x9 3+0x59 6+0x100"
    alert_rule_test:
      - eval_time: 140m
        alertname: AudioCleanupErrors
        exp_alerts:
          - exp_labels:
              severity: warning
              component: audio-storage
            exp_annotations:
              summary: The audio cleanup pass cannot delete expired delivery audio.
              description: >-
                3 failed deletions in the last two hours. Each hourly pass
                retries the same files, so this counts attempts, not files; the
                audio outlives its session until it clears. The gateway log
                names the failure; a tmpfs the gateway's user cannot write or
                read is the usual cause.

  # Sized for the gateway's 1 GiB tmpfs (see the ssf-audio-storage comment in
  # alert_rules.yml). Neither directory alone is over 768 MiB; together they are.
  - interval: 1m
    input_series:
      - series: 'audio_storage_disk_usage_bytes{job="api_gateway",instance="api_gateway:8000",directory="original"}'
        values: "419430400+0x20"
      - series: 'audio_storage_disk_usage_bytes{job="api_gateway",instance="api_gateway:8000",directory="translated"}'
        values: "419430400+0x20"
    alert_rule_test:
      - eval_time: 10m
        alertname: AudioStorageDiskUsageHigh
        exp_alerts:
          - exp_labels:
              severity: warning
              component: audio-storage
            exp_annotations:
              summary: Delivery audio fills three quarters of its tmpfs.
              description: >-
                Delivery audio totals 800 MiB of the gateway's 1 GiB tmpfs.
                Sessions free theirs when they end, so check
                AudioCleanupNotRunning and AudioCleanupErrors and whether many
                long sessions run at once. New voice messages fail once the
                tmpfs is full.
      - eval_time: 10m
        alertname: AudioStorageDiskUsageCritical
        exp_alerts: []

  - interval: 1m
    input_series:
      - series: 'audio_storage_disk_usage_bytes{job="api_gateway",instance="api_gateway:8000",directory="original"}'
        values: "524288000+0x20"
      - series: 'audio_storage_disk_usage_bytes{job="api_gateway",instance="api_gateway:8000",directory="translated"}'
        values: "461373440+0x20"
    alert_rule_test:
      - eval_time: 10m
        alertname: AudioStorageDiskUsageCritical
        exp_alerts:
          - exp_labels:
              severity: critical
              component: audio-storage
            exp_annotations:
              summary: Delivery audio nearly fills its tmpfs.
              description: >-
                Delivery audio totals 940 MiB of the gateway's 1 GiB tmpfs and
                is still growing past the warning threshold. New voice messages
                fail once it is full.

  # A busy afternoon, half the tmpfs, is quiet.
  - interval: 1m
    input_series:
      - series: 'audio_storage_disk_usage_bytes{job="api_gateway",instance="api_gateway:8000",directory="original"}'
        values: "268435456+0x20"
      - series: 'audio_storage_disk_usage_bytes{job="api_gateway",instance="api_gateway:8000",directory="translated"}'
        values: "268435456+0x20"
    alert_rule_test:
      - eval_time: 10m
        alertname: AudioStorageDiskUsageHigh
        exp_alerts: []
      - eval_time: 10m
        alertname: AudioStorageDiskUsageCritical
        exp_alerts: []

  # Studio is unreachable while guests join: every activation's policy read
  # fails. The floor of three failures is met at 3m, so the alert holds from
  # there and fires at 13m, not a minute earlier.
  - interval: 1m
    input_series:
      - series: 'ssf_studio_policy_read_total{job="api_gateway",stage="activation",outcome="unavailable"}'
        values: "0+1x40"
      - series: 'ssf_studio_policy_read_total{job="api_gateway",stage="activation",outcome="ok"}'
        values: "0+0x40"
      - series: 'ssf_studio_policy_read_total{job="api_gateway",stage="activation",outcome="contract_error"}'
        values: "0+0x40"
    alert_rule_test:
      - eval_time: 12m
        alertname: StudioPolicyReadsFailing
        exp_alerts: []
      - eval_time: 13m
        alertname: StudioPolicyReadsFailing
        exp_alerts:
          - exp_labels:
              severity: critical
              component: studio
            exp_annotations:
              summary: Most live Studio policy reads are failing.
              description: "100% of Studio policy reads failed over the last ten minutes. Staff cannot start sessions or recordings while this lasts; conversations already running and their translation keep working. Check that Studio answers from the gateway and that the ssf-runtime client can still obtain a token. By outcome in ssf_studio_policy_read_total: unavailable means Studio, a proxy in front of it or the token endpoint did not answer, contract_error means a refused token or an answer outside the contract."
      - eval_time: 25m
        alertname: StudioPolicyReadsFailing
        exp_alerts:
          - exp_labels:
              severity: critical
              component: studio
            exp_annotations:
              summary: Most live Studio policy reads are failing.
              description: "100% of Studio policy reads failed over the last ten minutes. Staff cannot start sessions or recordings while this lasts; conversations already running and their translation keep working. Check that Studio answers from the gateway and that the ssf-runtime client can still obtain a token. By outcome in ssf_studio_policy_read_total: unavailable means Studio, a proxy in front of it or the token endpoint did not answer, contract_error means a refused token or an answer outside the contract."

  # Two failed clicks three minutes apart while Studio restarts, nothing else
  # reading: the ratio is 100% for thirteen minutes, but two reads are not a
  # persistent failure. Without the floor this fires at 13m.
  - interval: 1m
    input_series:
      - series: 'ssf_studio_policy_read_total{job="api_gateway",stage="session_create",outcome="unavailable"}'
        values: "0 0 0 1 1 1 2+0x30"
      - series: 'ssf_studio_policy_read_total{job="api_gateway",stage="session_create",outcome="ok"}'
        values: "0+0x36"
    alert_rule_test:
      - eval_time: 11m
        alertname: StudioPolicyReadsFailing
        exp_alerts: []
      - eval_time: 13m
        alertname: StudioPolicyReadsFailing
        exp_alerts: []
      - eval_time: 20m
        alertname: StudioPolicyReadsFailing
        exp_alerts: []

  # One failed read among many successful ones.
  - interval: 1m
    input_series:
      - series: 'ssf_studio_policy_read_total{job="api_gateway",stage="activation",outcome="unavailable"}'
        values: "0 0 0 1+0x30"
      - series: 'ssf_studio_policy_read_total{job="api_gateway",stage="activation",outcome="ok"}'
        values: "0+1x33"
    alert_rule_test:
      - eval_time: 12m
        alertname: StudioPolicyReadsFailing
        exp_alerts: []

  # Failures arriving every three minutes, nothing succeeding: persistent
  # although sparse, so it pages once ten minutes have held three failures.
  - interval: 1m
    input_series:
      - series: 'ssf_studio_policy_read_total{job="api_gateway",stage="activation",outcome="unavailable"}'
        values: "0 0 1 1 1 2 2 2 3 3 3 4 4 4 5 5 5 6 6 6 7 7 7 8 8 8 9 9 9 10 10 10 11 11 11 12 12 12 13 13 13"
      - series: 'ssf_studio_policy_read_total{job="api_gateway",stage="activation",outcome="ok"}'
        values: "0+0x40"
    alert_rule_test:
      - eval_time: 30m
        alertname: StudioPolicyReadsFailing
        exp_alerts:
          - exp_labels:
              severity: critical
              component: studio
            exp_annotations:
              summary: Most live Studio policy reads are failing.
              description: "100% of Studio policy reads failed over the last ten minutes. Staff cannot start sessions or recordings while this lasts; conversations already running and their translation keep working. Check that Studio answers from the gateway and that the ssf-runtime client can still obtain a token. By outcome in ssf_studio_policy_read_total: unavailable means Studio, a proxy in front of it or the token endpoint did not answer, contract_error means a refused token or an answer outside the contract."

  # Four failed and six successful reads every ten minutes: the floor is met,
  # but most reads succeed, so the ratio keeps it quiet.
  - interval: 1m
    input_series:
      - series: 'ssf_studio_policy_read_total{job="api_gateway",stage="activation",outcome="unavailable"}'
        values: "0+0.4x40"
      - series: 'ssf_studio_policy_read_total{job="api_gateway",stage="activation",outcome="ok"}'
        values: "0+0.6x40"
    alert_rule_test:
      - eval_time: 30m
        alertname: StudioPolicyReadsFailing
        exp_alerts: []

  # Six failed and four successful reads every ten minutes: above one half.
  - interval: 1m
    input_series:
      - series: 'ssf_studio_policy_read_total{job="api_gateway",stage="activation",outcome="unavailable"}'
        values: "0+0.6x40"
      - series: 'ssf_studio_policy_read_total{job="api_gateway",stage="activation",outcome="ok"}'
        values: "0+0.4x40"
    alert_rule_test:
      - eval_time: 14m
        alertname: StudioPolicyReadsFailing
        exp_alerts: []
      - eval_time: 30m
        alertname: StudioPolicyReadsFailing
        exp_alerts:
          - exp_labels:
              severity: critical
              component: studio
            exp_annotations:
              summary: Most live Studio policy reads are failing.
              description: "60% of Studio policy reads failed over the last ten minutes. Staff cannot start sessions or recordings while this lasts; conversations already running and their translation keep working. Check that Studio answers from the gateway and that the ssf-runtime client can still obtain a token. By outcome in ssf_studio_policy_read_total: unavailable means Studio, a proxy in front of it or the token endpoint did not answer, contract_error means a refused token or an answer outside the contract."

  # A suspended tenant refuses every read on purpose: not a failure.
  - interval: 1m
    input_series:
      - series: 'ssf_studio_policy_read_total{job="api_gateway",stage="session_create",outcome="tenant_conflict"}'
        values: "0+1x40"
      - series: 'ssf_studio_policy_read_total{job="api_gateway",stage="session_create",outcome="unavailable"}'
        values: "0+0x40"
      - series: 'ssf_studio_policy_read_total{job="api_gateway",stage="session_create",outcome="contract_error"}'
        values: "0+0x40"
    alert_rule_test:
      - eval_time: 25m
        alertname: StudioPolicyReadsFailing
        exp_alerts: []

  # Guests keep asking for content and every answer comes from the cache after
  # a failed live read. The installation route is healthy and stays quiet.
  - interval: 1m
    input_series:
      - series: 'ssf_studio_content_fetch_total{job="api_gateway",endpoint="guest_content",outcome="stale"}'
        values: "0+1x60"
      - series: 'ssf_studio_content_fetch_total{job="api_gateway",endpoint="guest_content",outcome="live"}'
        values: "0+0x60"
      - series: 'ssf_studio_content_fetch_total{job="api_gateway",endpoint="installation",outcome="stale"}'
        values: "0+0x60"
      - series: 'ssf_studio_content_fetch_total{job="api_gateway",endpoint="installation",outcome="cached"}'
        values: "0+1x60"
    alert_rule_test:
      - eval_time: 20m
        alertname: StudioContentStale
        exp_alerts: []
      - eval_time: 21m
        alertname: StudioContentStale
        exp_alerts:
          - exp_labels:
              severity: warning
              component: studio
              endpoint: guest_content
            exp_annotations:
              summary: Studio display content is being served stale or not at all.
              description: "The guest_content content route has answered from old content or without content, and never from a fresh Studio read, for twenty minutes. Users see the last known Studio texts, or the bundled texts and the bundled feedback form where none are held. Check that Studio answers from the gateway and that the ssf-runtime client can still obtain a token; StudioPolicyReadsFailing fires as well when policy reads fail too. A code of tenant_suspended, ssf_plugin_inactive or ssf_tenant_not_ready in the gateway's 'Studio content read failed' log line means Studio switched that tenant off on purpose."
      - eval_time: 50m
        alertname: StudioContentStale
        exp_alerts:
          - exp_labels:
              severity: warning
              component: studio
              endpoint: guest_content
            exp_annotations:
              summary: Studio display content is being served stale or not at all.
              description: "The guest_content content route has answered from old content or without content, and never from a fresh Studio read, for twenty minutes. Users see the last known Studio texts, or the bundled texts and the bundled feedback form where none are held. Check that Studio answers from the gateway and that the ssf-runtime client can still obtain a token; StudioPolicyReadsFailing fires as well when policy reads fail too. A code of tenant_suspended, ssf_plugin_inactive or ssf_tenant_not_ready in the gateway's 'Studio content read failed' log line means Studio switched that tenant off on purpose."

  # Studio is down and nothing was ever cached: every answer is unavailable
  # and the browsers show bundled texts.
  - interval: 1m
    input_series:
      - series: 'ssf_studio_content_fetch_total{job="api_gateway",endpoint="installation",outcome="unavailable"}'
        values: "0+1x60"
      - series: 'ssf_studio_content_fetch_total{job="api_gateway",endpoint="installation",outcome="stale"}'
        values: "0+0x60"
      - series: 'ssf_studio_content_fetch_total{job="api_gateway",endpoint="installation",outcome="live"}'
        values: "0+0x60"
      - series: 'ssf_studio_content_fetch_total{job="api_gateway",endpoint="installation",outcome="cached"}'
        values: "0+0x60"
    alert_rule_test:
      - eval_time: 20m
        alertname: StudioContentStale
        exp_alerts: []
      - eval_time: 30m
        alertname: StudioContentStale
        exp_alerts:
          - exp_labels:
              severity: warning
              component: studio
              endpoint: installation
            exp_annotations:
              summary: Studio display content is being served stale or not at all.
              description: "The installation content route has answered from old content or without content, and never from a fresh Studio read, for twenty minutes. Users see the last known Studio texts, or the bundled texts and the bundled feedback form where none are held. Check that Studio answers from the gateway and that the ssf-runtime client can still obtain a token; StudioPolicyReadsFailing fires as well when policy reads fail too. A code of tenant_suspended, ssf_plugin_inactive or ssf_tenant_not_ready in the gateway's 'Studio content read failed' log line means Studio switched that tenant off on purpose."

  # Stale answers between successful live reads are a flaky Studio, not an
  # outage: the cache is refreshed every ten minutes.
  - interval: 1m
    input_series:
      - series: 'ssf_studio_content_fetch_total{job="api_gateway",endpoint="staff_content",outcome="unavailable"}'
        values: "0+1x60"
      - series: 'ssf_studio_content_fetch_total{job="api_gateway",endpoint="staff_content",outcome="live"}'
        values: "0+0.1x60"
    alert_rule_test:
      - eval_time: 50m
        alertname: StudioContentStale
        exp_alerts: []

  # Studio recovers after fifteen minutes. Policy reads during the conversation
  # refresh the cache, so the route answers `cached` and never `live`: that is
  # a fresh answer, and the alert must not keep firing on the old stale ones.
  - interval: 1m
    input_series:
      - series: 'ssf_studio_content_fetch_total{job="api_gateway",endpoint="staff_content",outcome="stale"}'
        values: "0+1x15 15+0x45"
      - series: 'ssf_studio_content_fetch_total{job="api_gateway",endpoint="staff_content",outcome="cached"}'
        values: "0+0x15 0+1x45"
      - series: 'ssf_studio_content_fetch_total{job="api_gateway",endpoint="staff_content",outcome="live"}'
        values: "0+0x60"
    alert_rule_test:
      - eval_time: 22m
        alertname: StudioContentStale
        exp_alerts: []
      - eval_time: 45m
        alertname: StudioContentStale
        exp_alerts: []

  # One stale answer at a quiet hour, then nobody asks: a blip, not an outage.
  - interval: 1m
    input_series:
      - series: 'ssf_studio_content_fetch_total{job="api_gateway",endpoint="guest_languages",outcome="stale"}'
        values: "0 0 0 1+0x60"
      - series: 'ssf_studio_content_fetch_total{job="api_gateway",endpoint="guest_languages",outcome="live"}'
        values: "0+0x63"
      - series: 'ssf_studio_content_fetch_total{job="api_gateway",endpoint="guest_languages",outcome="cached"}'
        values: "0+0x63"
    alert_rule_test:
      - eval_time: 20m
        alertname: StudioContentStale
        exp_alerts: []
      - eval_time: 30m
        alertname: StudioContentStale
        exp_alerts: []

  # A gateway that started without a Studio runtime client reads nothing, so
  # the read counter stays silent; the gauge does not.
  - interval: 1m
    input_series:
      - series: 'ssf_studio_policy_gate_bound{job="api_gateway",instance="api_gateway:8000"}'
        values: "0+0x20"
    alert_rule_test:
      - eval_time: 10m
        alertname: StudioPolicyGateUnbound
        exp_alerts:
          - exp_labels:
              severity: critical
              component: studio
            exp_annotations:
              summary: The gateway cannot read the Studio policy at all.
              description: "The gateway started without a usable Studio runtime client, so it never reads the policy: staff cannot start sessions or recordings. Its startup log says 'Studio runtime client unbound' with the reason. Check STUDIO_RUNTIME_CONFIGURATION_BASE_URL and the ssf-runtime client settings (STUDIO_RUNTIME_TOKEN_URL, STUDIO_RUNTIME_CLIENT_SECRET) in .env, then recreate the gateway."

  - interval: 1m
    input_series:
      - series: 'ssf_studio_policy_gate_bound{job="api_gateway",instance="api_gateway:8000"}'
        values: "1+0x20"
    alert_rule_test:
      - eval_time: 10m
        alertname: StudioPolicyGateUnbound
        exp_alerts: []

  # Recording retention (#618).
  # A worker whose last beat was at minute 0: past 30 min at 30m01s, firing ten minutes on.
  - interval: 1m
    input_series:
      - series: 'ssf_retention_worker_last_beat_timestamp_seconds{job="api_gateway",instance="api_gateway:8000",site="primary"}'
        values: "0+0x60"
    alert_rule_test:
      - eval_time: 41m
        alertname: RecordingRetentionWorkerSilent
        exp_alerts:
          - exp_labels:
              severity: critical
              component: recording
              job: api_gateway
              instance: api_gateway:8000
              site: primary
            exp_annotations:
              summary: A retention worker has stopped finishing its passes.
              description: "The primary archive site's retention worker has not finished a pass for over thirty minutes, so locks, holds and expiry there are not being kept up. Check its container on that VM (archive_compose ps retention, then its log) and its link to ssf_recording. See docs/operations/runbooks/recording-retention-deployment.md, 'Alerts'."

  # Still pending ten minutes after the last beat; and a worker beating every pass never fires.
  - interval: 1m
    input_series:
      - series: 'ssf_retention_worker_last_beat_timestamp_seconds{job="api_gateway",instance="api_gateway:8000",site="replica"}'
        values: "0+0x60"
    alert_rule_test:
      - eval_time: 35m
        alertname: RecordingRetentionWorkerSilent
        exp_alerts: []

  - interval: 1m
    input_series:
      - series: 'ssf_retention_worker_last_beat_timestamp_seconds{job="api_gateway",instance="api_gateway:8000",site="replica"}'
        values: "0+60x90"
    alert_rule_test:
      - eval_time: 45m
        alertname: RecordingRetentionWorkerSilent
        exp_alerts: []
      - eval_time: 90m
        alertname: RecordingRetentionWorkerSilent
        exp_alerts: []

  - interval: 1m
    input_series:
      - series: 'ssf_retention_worker_failing_seconds{job="api_gateway",instance="api_gateway:8000",site="primary"}'
        values: "86401+60x60"
    alert_rule_test:
      - eval_time: 31m
        alertname: RecordingRetentionWorkerFailing
        exp_alerts:
          - exp_labels:
              severity: warning
              component: recording
              job: api_gateway
              instance: api_gateway:8000
              site: primary
            exp_annotations:
              summary: A retention step has been failing or overdue for over a day.
              description: "A retention step on the primary archive site has failed, or waited, for over a day: a version's lock, hold or deletion, or a whole tenant's pass, is behind. The worker's log names the failure's type. Usually the site's S3 API, its retention credential or a tenant without a bucket: check them. See docs/operations/runbooks/recording-retention-deployment.md, 'Alerts'."

  # Exactly a day is not over a day.
  - interval: 1m
    input_series:
      - series: 'ssf_retention_worker_failing_seconds{job="api_gateway",instance="api_gateway:8000",site="replica"}'
        values: "86400+0x60"
    alert_rule_test:
      - eval_time: 45m
        alertname: RecordingRetentionWorkerFailing
        exp_alerts: []

  - interval: 1m
    input_series:
      - series: 'ssf_retention_worker_halted{job="api_gateway",instance="api_gateway:8000",site="primary"}'
        values: "1+0x20"
    alert_rule_test:
      - eval_time: 6m
        alertname: RecordingRetentionWorkerHalted
        exp_alerts:
          - exp_labels:
              severity: critical
              component: recording
              job: api_gateway
              instance: api_gateway:8000
              site: primary
            exp_annotations:
              summary: A retention worker holds deletions back after a database restore.
              description: "The primary archive site's retention worker found ssf_recording behind the audit position it last saw, as after a restore from a dump. It lifts no hold and deletes nothing until an operator works through the restore procedure and runs acknowledge-restore. See docs/operations/runbooks/recording-retention-deployment.md, 'After restoring ssf_recording'."

  - interval: 1m
    input_series:
      - series: 'ssf_retention_worker_halted{job="api_gateway",instance="api_gateway:8000",site="replica"}'
        values: "0+0x20"
    alert_rule_test:
      - eval_time: 10m
        alertname: RecordingRetentionWorkerHalted
        exp_alerts: []

  - interval: 1m
    input_series:
      - series: 'ssf_retention_hold_mismatches{job="api_gateway",instance="api_gateway:8000",site="primary"}'
        values: "2+0x90"
    alert_rule_test:
      - eval_time: 61m
        alertname: RecordingRetentionHoldMismatch
        exp_alerts:
          - exp_labels:
              severity: warning
              component: recording
              job: api_gateway
              instance: api_gateway:8000
              site: primary
            exp_annotations:
              summary: Archive versions are held without a legal hold.
              description: "2 versions on the primary archive site are held although no legal hold applies, and no hold_off decision later than the hold exists to lift them. After a restore, have a supervisor lift the hold again; otherwise check the audit log for the conversation's decisions. See docs/operations/runbooks/recording-retention-deployment.md, 'Alerts'."

  - interval: 1m
    input_series:
      - series: 'ssf_retention_hold_mismatches{job="api_gateway",instance="api_gateway:8000",site="replica"}'
        values: "0+0x90"
    alert_rule_test:
      - eval_time: 70m
        alertname: RecordingRetentionHoldMismatch
        exp_alerts: []

  # Under an hour of mismatch is not yet worth a warning.
  - interval: 1m
    input_series:
      - series: 'ssf_retention_hold_mismatches{job="api_gateway",instance="api_gateway:8000",site="replica"}'
        values: "1+0x90"
    alert_rule_test:
      - eval_time: 59m
        alertname: RecordingRetentionHoldMismatch
        exp_alerts: []
