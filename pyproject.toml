[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm[toml]>=10.0.5"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-speech-flow"
description = "Containerized microservice system for multilingual real-time communication"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
dynamic = ["version"]

[tool.setuptools_scm]
write_to = "_version.py"

# Black Configuration
[tool.black]
line-length = 100
target-version = ['py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
  | __pycache__
  | monitoring/grafana
  | monitoring/loki
  | monitoring/loki-data
  | monitoring/promtail-data
)/
'''

# isort Configuration
[tool.isort]
profile = "black"
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
line_length = 100
skip_gitignore = true
known_first_party = ["services"]
sections = ["FUTURE", "STDLIB", "THIRDPARTY", "FIRSTPARTY", "LOCALFOLDER"]

# Flake8 Configuration (via setup.cfg since flake8 doesn't support pyproject.toml yet)
# See setup.cfg for flake8 configuration

# MyPy Configuration
[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false  # Start with gradual adoption
disallow_incomplete_defs = false
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

# Per-module options for gradual adoption
[[tool.mypy.overrides]]
module = "services.api_gateway.*"
disallow_untyped_defs = true
disallow_incomplete_defs = true

[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = false
disallow_untyped_defs = false

# Type-checking ratchet. These modules predate the blocking mypy gate and
# still carry findings. Every other module under services.api_gateway.* is
# enforced. The list is the union of what mypy 1.13 and the pinned 2.3.1
# report, so it holds whichever of the two a developer has installed.
# It may only ever shrink: removing a module means its errors are fixed.
# Never add to it to make a new change pass.
[[tool.mypy.overrides]]
module = [
    "services.api_gateway.circuit_breaker",
    "services.api_gateway.circuit_breaker_client",
    "services.api_gateway.enhanced_audio_validation",
    "services.api_gateway.feedback.maintenance",
    "services.api_gateway.feedback.read",
    "services.api_gateway.feedback.repository",
    "services.api_gateway.graceful_degradation",
    "services.api_gateway.message_telemetry",
    "services.api_gateway.pipeline_logic",
    "services.api_gateway.quality_telemetry",
    "services.api_gateway.quality_telemetry_otlp",
    "services.api_gateway.realtime_ticket",
    "services.api_gateway.routes.admin",
    "services.api_gateway.routes.circuit_breaker",
    "services.api_gateway.routes.customer",
    "services.api_gateway.routes.feedback",
    "services.api_gateway.routes.health",
    "services.api_gateway.routes.index",
    "services.api_gateway.routes.login",
    "services.api_gateway.routes.metrics",
    "services.api_gateway.routes.session",
    "services.api_gateway.routes.upload",
    "services.api_gateway.service_health",
    "services.api_gateway.session",
    "services.api_gateway.session_store",
    "services.api_gateway.studio_login_directory_client",
    "services.api_gateway.studio_runtime_client",
    "services.api_gateway.studio_runtime_flow",
    "services.api_gateway.tenant_persistence",
    "services.api_gateway.tenant_session",
    "services.api_gateway.tests.conftest",
    "services.api_gateway.tests.test_admin",
    "services.api_gateway.tests.test_customer",
    "services.api_gateway.tests.test_endpoints",
    "services.api_gateway.tests.test_health",
    "services.api_gateway.tests.test_metrics",
    "services.api_gateway.tests.test_pipeline",
    "services.api_gateway.translation_refiner",
    "services.api_gateway.utils.health_utils",
    "services.api_gateway.websocket_fallback",
    "services.api_gateway.websocket_monitoring_routes",
]
ignore_errors = true

# Ignore third-party packages without stubs
[[tool.mypy.overrides]]
module = [
    "prometheus_client.*",
    "uvicorn.*",
    "psutil.*",
    "redis.*"
]
ignore_missing_imports = true

# Coverage Configuration
[tool.coverage.run]
source = ["services"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/venv/*",
    "*/.venv/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

# Bandit Security Configuration
[tool.bandit]
exclude_dirs = ["tests", "venv", ".venv"]
skips = ["B101", "B601"]  # Skip assert_used and shell_injection_subprocess (common in tests)
